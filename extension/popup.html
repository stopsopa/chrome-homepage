<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        :root {
            --bg-color: #fafafa;
            --text-color: #333333;
            --muted-color: #666666;
            --border-color: #cccccc;
            --primary-color: #007bff;
            --primary-hover: #0056b3;
            --success-color: #28a745;
            --error-color: #dc3545;
            --secondary-bg: #f1f3f5;
            --secondary-hover: #e9ecef;
            --secondary-text: #495057;
            --secondary-border: #ced4da;
            --promo-bg: #f3f7fd;
            --promo-border: #d2e3fc;
            --promo-badge-bg: #e8f0fe;
            --promo-badge-text: #1a73e8;
            --yt-color: #d93025;
            --yt-hover: #b31412;
            --hr-color: #e0e0e0;
            --font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body { 
            font-family: var(--font-family); 
            padding: 16px 18px; 
            width: 480px; 
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            box-sizing: border-box;
        }

        h3 {
            margin-top: 0;
            margin-bottom: 12px;
            color: var(--text-color);
            font-size: 15px;
            font-weight: 600;
        }

        .input-wrapper {
            position: relative;
            width: 100%;
            margin-bottom: 10px;
        }

        .input-wrapper input { 
            width: 100%; 
            box-sizing: border-box; 
            margin-bottom: 0; 
            padding: 8px 30px 8px 10px; 
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 13px;
            background-color: #ffffff;
            color: var(--text-color);
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.25);
        }

        .clear-btn {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 2px 6px;
            font-size: 16px;
            color: var(--muted-color);
            border-radius: 50%;
            display: none;
            line-height: 1;
            user-select: none;
        }

        .clear-btn:hover {
            color: var(--text-color);
            background-color: var(--secondary-hover);
        }

        .primary-btn { 
            width: 100%; 
            padding: 8px 12px; 
            cursor: pointer; 
            background-color: var(--primary-color);
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 500;
            transition: background-color 0.15s ease;
        }

        .primary-btn:hover {
            background-color: var(--primary-hover);
        }

        .status { 
            color: var(--success-color); 
            display: none; 
            margin-top: 8px; 
            font-size: 12px;
            text-align: center;
        }

        .homepage-container {
            margin-top: 10px;
            text-align: center;
        }

        .homepage-link {
            color: var(--primary-color);
            text-decoration: none;
            font-size: 12px;
            display: inline-block;
        }

        .homepage-link:hover {
            text-decoration: underline;
            color: var(--primary-hover);
        }

        hr {
            border: 0;
            border-top: 1px solid var(--hr-color);
            margin: 14px 0;
        }

        .promo-card {
            background-color: var(--promo-bg);
            border: 1px solid var(--promo-border);
            border-radius: 8px;
            padding: 12px 14px;
            margin-bottom: 10px;
            text-align: left;
        }

        .promo-badge {
            display: inline-block;
            background-color: var(--promo-badge-bg);
            color: var(--promo-badge-text);
            font-size: 10px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 8px;
            margin-bottom: 6px;
            letter-spacing: 0.3px;
        }

        .promo-headline {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-color);
            margin: 0 0 8px 0;
            line-height: 1.4;
        }

        .promo-action-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 12px;
            line-height: 1.4;
        }

        .promo-item {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 4px;
        }

        .yt-link {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: var(--yt-color);
            text-decoration: none;
            font-weight: 600;
        }

        .yt-link:hover {
            text-decoration: underline;
            color: var(--yt-hover);
        }

        .yt-icon {
            flex-shrink: 0;
            vertical-align: middle;
        }

        .v2-link {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }

        .v2-link:hover {
            text-decoration: underline;
            color: var(--primary-hover);
        }

        .secondary-btn {
            width: 100%;
            padding: 6px 10px;
            cursor: pointer;
            background-color: var(--secondary-bg);
            color: var(--secondary-text);
            border: 1px solid var(--secondary-border);
            border-radius: 4px;
            font-size: 11px;
            font-weight: 500;
            transition: background-color 0.15s ease;
        }

        .secondary-btn:hover {
            background-color: var(--secondary-hover);
        }

        .reset-status {
            color: var(--success-color);
            display: none;
            margin-top: 6px;
            font-size: 11px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h3>Set New Tab URL</h3>
    <div class="input-wrapper">
        <input type="url" id="linkInput" placeholder="https://example.com" />
        <button type="button" id="clearBtn" class="clear-btn" title="Clear input" aria-label="Clear input">&times;</button>
    </div>
    <button id="saveBtn" class="primary-btn">Save URL</button>
    <div id="status" class="status">Saved successfully!</div>
    
    <div class="homepage-container">
        <a href="https://chromewebstore.google.com/detail/custom-new-tab-redirect/phenpbfhfgcghknjgmdlkekpigfaaobe" target="_blank" rel="noopener noreferrer" class="homepage-link">Custom New Tab Redirect Homepage</a>
    </div>

    <hr />

    <div class="promo-container">
        <div class="promo-card">
            <div class="promo-badge">🚀 Upgrade Available</div>
            <div class="promo-headline">Supercharge your new tab experience with Version 2!</div>
            <div class="promo-action-row">
                <div class="promo-item">
                    <span>See how to use:</span>
                    <a href="https://youtu.be/1M98DR0YXp8" target="_blank" rel="noopener noreferrer" class="yt-link">
                        <svg class="yt-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                            <path fill="#FF0000" d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814z"/>
                            <path fill="#FFFFFF" d="M9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
                        </svg>
                        <span>Watch tutorial</span>
                    </a>
                </div>
                <div class="promo-item">
                    <span>Get the new version:</span>
                    <a href="https://chromewebstore.google.com/detail/custom-new-tab-mangement/jjhljniamhmpiicifiaaihnmhooafegp" target="_blank" rel="noopener noreferrer" class="v2-link">
                        Custom New Tab Mangement v2
                    </a>
                </div>
            </div>
        </div>
        <button id="resetPromoBtn" class="secondary-btn">Reset to show landing page every 10th load</button>
        <div id="resetStatus" class="reset-status"></div>
    </div>

    <script type="module" src="popup.js"></script>
</body>
</html>
