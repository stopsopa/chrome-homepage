<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Home</title>
    <link rel="stylesheet" href="homepage.css" />
    <link rel="stylesheet" href="popover.css" />
  </head>
  <body>
    <!-- Fixed wallpaper layer, sits behind everything -->
    <div id="wallpaper"></div>

    <!-- Grid takes full page -->
    <main id="grid-container">
      <!-- Bookmarks will be rendered here -->
    </main>

    <!-- Always-visible top-right controls: burger + wallpaper reload -->
    <div id="header-toggle-area">
      <!-- Reload wallpaper — always visible next to burger -->
      <button id="wallpaper-reload" data-testid="wallpaper-reload" title="Reload wallpaper">&#8635;</button>

      <button id="header-toggle" data-testid="header-toggle" title="Show controls">&#9776;</button>
    </div>

    <!-- Floating header panel, top-right, hidden by default -->
    <header id="header-panel" class="gcp-css hidden">
      <div class="header-actions">
        <!-- Open wallpaper settings modal -->
        <button
          id="wallpaper-settings-open"
          data-testid="wallpaper-settings-open"
          tabindex="-1"
          title="Wallpaper settings"
        >
          &#9881;
        </button>

        <button id="add-bookmark" class="hidden" tabindex="-1">Add Link</button>
        <button id="edit-toggle" tabindex="-1">Edit</button>
        <button id="header-hide" tabindex="-1" title="Hide controls">&times;</button>
      </div>
    </header>

    <!-- Bookmark Dialog -->
    <dialog id="bookmark-dialog" class="gcp-css">
      <form id="bookmark-form" method="dialog">
        <h2 id="dialog-title">Add Bookmark</h2>
        <div class="field input-wrapper">
          <input type="text" id="f-title" name="title" placeholder=" " required />
          <label for="f-title">Title</label>
        </div>
        <div class="field input-wrapper">
          <input type="url" id="f-url" name="url" placeholder=" " required />
          <label for="f-url">URL</label>
        </div>
        <div class="field input-wrapper">
          <input type="url" id="f-logo" name="logo" placeholder=" " required />
          <label for="f-logo">Logo URL</label>
        </div>
        <footer class="dialog-footer">
          <button type="button" id="dialog-cancel" class="btn-secondary">Cancel</button>
          <button type="submit" class="btn-primary">Submit</button>
        </footer>
      </form>
    </dialog>

    <!-- ============================================================
         WALLPAPER SETTINGS DIALOG
         Contains all filter sliders + checkboxes + animation controls.
         State is persisted to localStorage.
         ============================================================ -->
    <dialog id="wallpaper-dialog" data-testid="wallpaper-dialog">
      <div class="wp-panel">
        <h2 class="wp-title">Wallpaper Settings</h2>

        <!-- FILTER CONTROLS -->

        <div class="wp-control">
          <div class="wp-control-header">
            <div class="wp-control-left">
              <input
                id="brightnessEnabled"
                class="wp-control-checkbox"
                type="checkbox"
                data-testid="brightness-enabled"
                checked
              />
              <label class="wp-control-label" for="brightnessEnabled">Brightness</label>
            </div>
            <span id="brightnessValue" class="wp-control-value">98%</span>
          </div>
          <input id="brightness" type="range" min="0" max="200" value="98" data-testid="brightness-range" />
        </div>

        <div class="wp-control">
          <div class="wp-control-header">
            <div class="wp-control-left">
              <input
                id="saturationEnabled"
                class="wp-control-checkbox"
                type="checkbox"
                data-testid="saturation-enabled"
                checked
              />
              <label class="wp-control-label" for="saturationEnabled">Saturation</label>
            </div>
            <span id="saturationValue" class="wp-control-value">148%</span>
          </div>
          <input id="saturation" type="range" min="0" max="200" value="148" data-testid="saturation-range" />
        </div>

        <div class="wp-control">
          <div class="wp-control-header">
            <div class="wp-control-left">
              <input
                id="contrastEnabled"
                class="wp-control-checkbox"
                type="checkbox"
                data-testid="contrast-enabled"
                checked
              />
              <label class="wp-control-label" for="contrastEnabled">Contrast</label>
            </div>
            <span id="contrastValue" class="wp-control-value">71%</span>
          </div>
          <input id="contrast" type="range" min="0" max="200" value="71" data-testid="contrast-range" />
        </div>

        <!-- ANIMATION CONTROLS -->

        <div class="wp-animation-control">
          <label class="wp-animation-checkbox" for="animationEnabled">
            <input id="animationEnabled" type="checkbox" data-testid="animation-enabled" checked />
            <span>Enable wallpaper animation</span>
          </label>

          <div class="wp-control-header">
            <span class="wp-control-label">Animation speed</span>
            <span id="animationSpeedValue" class="wp-control-value">30s</span>
          </div>
          <input
            id="animationSpeed"
            type="range"
            min="5"
            max="120"
            step="5"
            value="30"
            data-testid="animation-speed-range"
          />
        </div>

        <div class="wp-dialog-footer">
          <button type="button" id="wallpaper-dialog-close" data-testid="wallpaper-dialog-close" class="btn-secondary">
            Close
          </button>
        </div>
      </div>
    </dialog>

    <script type="module" src="homepage.js"></script>
  </body>
</html>
